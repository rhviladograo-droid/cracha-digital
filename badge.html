<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crachá Digital - Grupo CRFF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d6a4f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
        }

        .badge-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge-header {
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
            padding: 25px;
            text-align: center;
            color: white;
            border-bottom: 4px solid #1b4332;
        }

        .badge-logo {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .badge-subtitle {
            font-size: 12px;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .badge-body {
            padding: 30px;
            text-align: center;
        }

        .employee-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(45, 106, 79, 0.3);
        }

        .employee-name {
            font-size: 26px;
            font-weight: 700;
            color: #1b4332;
            margin-bottom: 20px;
            word-break: break-word;
            line-height: 1.2;
        }

        .badge-info {
            background: #f0f9f7;
            border-left: 4px solid #40916c;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 14px;
            border-bottom: 1px solid #d8ede8;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #2d6a4f;
            text-align: left;
            flex: 0 0 40%;
        }

        .info-value {
            color: #1b4332;
            text-align: right;
            flex: 0 0 60%;
            word-break: break-word;
            font-weight: 500;
        }

        .status-container {
            margin-top: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-ativo {
            background: #d1e7dd;
            color: #0f5132;
            border: 2px solid #0f5132;
        }

        .status-inativo {
            background: #f8d7da;
            color: #842029;
            border: 2px solid #842029;
        }

        .badge-footer {
            background: #f0f9f7;
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #52796f;
            border-top: 1px solid #d8ede8;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #e0e0e0;
            border-top: 4px solid #40916c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #842029;
        }

        .error h2 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .instructions {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            border: 1px solid #0c5460;
        }

        @media (max-width: 480px) {
            .badge-body {
                padding: 20px;
            }

            .employee-name {
                font-size: 22px;
            }

            .employee-avatar {
                width: 100px;
                height: 100px;
                font-size: 40px;
            }

            .info-label {
                flex: 0 0 45%;
                font-size: 12px;
            }

            .info-value {
                flex: 0 0 55%;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge-card">
            <div id="content"></div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO - SUBSTITUIR COM A URL DO GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/d/SEU_PROJECT_ID/userweb/doGet";

        async function carregarCracha() {
            const contentDiv = document.getElementById('content');

            // Obter ID da URL (funciona em páginas normais e GitHub Pages)
            const urlParams = new URLSearchParams(window.location.search);
            const funcionarioId = urlParams.get('id');

            if (!funcionarioId) {
                contentDiv.innerHTML = `
                    <div class="badge-header">
                        <div class="badge-logo">GRUPO CRFF</div>
                        <div class="badge-subtitle">Crachá Digital</div>
                    </div>
                    <div class="badge-body">
                        <div class="instructions">
                            <h2>📱 Crachá Digital</h2>
                            <p style="margin-top: 10px;">Acesse com um ID válido:</p>
                            <p style="margin-top: 10px; font-family: monospace; background: white; padding: 8px; border-radius: 5px; color: #1b4332;">
                                ?id=001
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            // Mostrar loading
            contentDiv.innerHTML = `
                <div class="badge-header">
                    <div class="badge-logo">GRUPO CRFF</div>
                    <div class="badge-subtitle">Crachá Digital</div>
                </div>
                <div class="badge-body">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Carregando informações...</p>
                    </div>
                </div>
            `;

            try {
                // Chamada API
                const response = await fetch(`${API_URL}?id=${encodeURIComponent(funcionarioId)}`);
                const data = await response.json();

                if (data.erro) {
                    contentDiv.innerHTML = `
                        <div class="badge-header">
                            <div class="badge-logo">GRUPO CRFF</div>
                            <div class="badge-subtitle">Crachá Digital</div>
                        </div>
                        <div class="badge-body">
                            <div class="error">
                                <h2>❌ Não encontrado</h2>
                                <p>ID "${funcionarioId}" não existe no sistema.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Extrair primeira letra para avatar
                const primeiraLetra = (data.nome || "?").charAt(0).toUpperCase();
                const statusClass = (data.status || "").toLowerCase() === "ativo"
                    ? "status-ativo"
                    : "status-inativo";
                const statusTexto = (data.status || "Inativo").toUpperCase();

                // Renderizar crachá
                contentDiv.innerHTML = `
                    <div class="badge-header">
                        <div class="badge-logo">GRUPO CRFF</div>
                        <div class="badge-subtitle">Crachá Digital</div>
                    </div>
                    <div class="badge-body">
                        <div class="employee-avatar">${primeiraLetra}</div>
                        <div class="employee-name">${data.nome || "N/A"}</div>

                        <div class="badge-info">
                            <div class="info-row">
                                <span class="info-label">Centro de Custo:</span>
                                <span class="info-value">${data.centroCusto || "N/A"}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Cargo:</span>
                                <span class="info-value">${data.cargo || "N/A"}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Cidade:</span>
                                <span class="info-value">${data.cidade || "N/A"}</span>
                            </div>
                        </div>

                        <div class="status-container">
                            <div class="status-badge ${statusClass}">
                                ${data.status === "Ativo" || data.status === "ativo" ? "✓ Ativo" : "✗ Inativo"}
                            </div>
                        </div>
                    </div>
                    <div class="badge-footer">
                        <p>ID: ${data.id} • Atualizado: ${new Date().toLocaleString('pt-BR')}</p>
                    </div>
                `;

            } catch (error) {
                console.error("Erro:", error);
                contentDiv.innerHTML = `
                    <div class="badge-header">
                        <div class="badge-logo">GRUPO CRFF</div>
                        <div class="badge-subtitle">Crachá Digital</div>
                    </div>
                    <div class="badge-body">
                        <div class="error">
                            <h2>⚠️ Erro de Conexão</h2>
                            <p>Não foi possível carregar as informações.</p>
                            <p style="margin-top: 10px; font-size: 11px;">
                                Verifique se a API está configurada corretamente.
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        // Carregar ao abrir página
        window.addEventListener('load', carregarCracha);
        // Atualizar a cada 5 segundos
        setInterval(carregarCracha, 5000);
    </script>
</body>
</html>
